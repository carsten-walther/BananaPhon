[env:lilygo-t-display-s3]
; Auf Major 6 gepinnt: ein künftiges espressif32 7.x (neuer Arduino-Core)
; soll den Build nicht ungefragt brechen — Upgrade dann bewusst.
platform = espressif32 @ ^6
board = lilygo-t-display-s3
framework = arduino

monitor_speed = 115200

; Dateisystem für gespeicherte Loops (LittleFS auf der spiffs-Partition,
; 3,4 MB). Die Demo-Loops in data/ landen per `pio run -t uploadfs` auf
; dem Gerät; der Looper liest/schreibt Loops im Betrieb dorthin.
board_build.filesystem = littlefs

lib_deps =
    sauloverissimo/ESP32_Host_MIDI @ ^7.0.0
    lovyan03/LovyanGFX @ ^1.2.25
    lathoub/AppleMIDI @ ^3.3.0
    tzapu/WiFiManager @ ^2.0.17

;Build Einstellungen
build_unflags =
    -std=gnu++11
build_flags =
    -std=gnu++17

; Formatierung: pio run -t format  (nutzt .clang-format)
extra_scripts = pre:scripts/format.py

; Statische Analyse: pio check
check_tool = cppcheck
check_flags =
    cppcheck: --enable=warning,style --inline-suppr --suppress=unusedFunction --suppress=*:*/.platformio/* --suppress=*:*/.pio/*
check_src_filters =
    +<src/>
    +<include/>

; ------------------------------------------------
; Kabelloses Flashen (OTA, ArduinoOTA/espota)
; ------------------------------------------------
; Erbt alles von der Standard-Umgebung, ersetzt nur den Upload-Weg:
;   pio run -e lilygo-t-display-s3-ota -t upload
; Setzt eine bestehende WLAN-Verbindung voraus (ENABLE_OTA in Config.h).
; Statt bananaphon.local kann auch die IP des Geräts stehen.
[env:lilygo-t-display-s3-ota]
extends = env:lilygo-t-display-s3
upload_protocol = espota
upload_port = bananaphon.local
; Passwort (nur falls OTA_PASSWORD in Config.h gesetzt ist):
; upload_flags = --auth=DEIN_OTA_PASSWORT
