[env:lilygo-t-display-s3]
; Auf Major 6 gepinnt (Arduino-ESP32-Core 2.0.x / ESP-IDF 4.4). Ein
; Upgrade auf espressif32 7.x zieht den Core 3.0 nach und bricht genau
; die heiklen Stellen dieses Projekts (I2S-Treiber und Touch-API wurden
; neu geschrieben) — deshalb bewusst gepinnt, Upgrade nur geplant.
; Siehe die Notiz am Dateiende.
platform = espressif32 @ ^6
board = lilygo-t-display-s3
framework = arduino

; Baudrate des seriellen Monitors (pio device monitor)
monitor_speed = 115200

; Dateisystem für gespeicherte Loops (LittleFS auf der spiffs-Partition,
; 3,4 MB). Die Demo-Loops in data/ landen per `pio run -t uploadfs` auf
; dem Gerät; der Looper liest/schreibt Loops im Betrieb dorthin.
board_build.filesystem = littlefs

; Externe Bibliotheken (PlatformIO Registry, ^ = kompatibles Update):
lib_deps =
    sauloverissimo/ESP32_Host_MIDI @ ^7.0.0 ; USB-Host-MIDI (Buchse)
    lovyan03/LovyanGFX @ ^1.2.25             ; Display-Treiber (ST7789)
    lathoub/AppleMIDI @ ^3.3.0               ; RTP-/Netzwerk-MIDI (WLAN)
    tzapu/WiFiManager @ ^2.0.17              ; WLAN-Einrichtung per Portal

; C++17 erzwingen: der Arduino-Core baut per Default mit gnu++11, wir
; nutzen aber C++17-Features (z. B. constexpr, structured bindings).
build_unflags =
    -std=gnu++11
build_flags =
    -std=gnu++17

; Formatierung: pio run -t format  (nutzt .clang-format)
extra_scripts = pre:scripts/format.py

; Statische Analyse: pio check
check_tool = cppcheck
check_flags =
    cppcheck: --enable=warning,style --inline-suppr --suppress=unusedFunction --suppress=*:*/.platformio/* --suppress=*:*/.pio/*
check_src_filters =
    +<src/>
    +<include/>

; ------------------------------------------------
; Kabelloses Flashen (OTA, ArduinoOTA/espota)
; ------------------------------------------------
; Erbt alles von der Standard-Umgebung, ersetzt nur den Upload-Weg:
;   pio run -e lilygo-t-display-s3-ota -t upload
; Setzt eine bestehende WLAN-Verbindung voraus (ENABLE_OTA in Config.h).
; Statt bananaphon.local kann auch die IP des Geräts stehen.
[env:lilygo-t-display-s3-ota]
extends = env:lilygo-t-display-s3
upload_protocol = espota
upload_port = bananaphon.local
; Passwort (nur falls OTA_PASSWORD in Config.h gesetzt ist):
; upload_flags = --auth=DEIN_OTA_PASSWORT

; ------------------------------------------------
; Hinweis: Upgrade auf espressif32 7.x?
; ------------------------------------------------
; espressif32 6.x  → Arduino-ESP32-Core 2.0.x (ESP-IDF 4.4)  [aktuell]
; espressif32 7.x  → Arduino-ESP32-Core 3.0.x (ESP-IDF 5.1)
;
; Der Sprung ist ein Major-Upgrade mit API-Brüchen, die genau die
; hardwarenahen Teile dieses Projekts treffen:
;   - I2S: Der alte Treiber (driver/i2s.h) ist raus, es gilt die neue
;     i2s_std-API — SpeakerController müsste umgeschrieben werden.
;   - Touch: geänderte Schwellwert-/Read-Semantik auf dem ESP32-S3 —
;     TouchSensor bräuchte eine neue Kalibrierung.
;   - ledc/analogRead: geänderte Signaturen und ADC-Kalibrierung.
; Zusätzlich muss jede Bibliothek in lib_deps Core 3.0 unterstützen
; (v. a. ESP32_Host_MIDI ist zu prüfen).
;
; Empfehlung: vorerst auf 6.x bleiben. Der aktuelle Stand läuft stabil,
; und das Upgrade bringt hier keinen Funktionsgewinn, aber echtes
; Portierungs- und Regressionsrisiko an Audio und Touch. Sinnvoll erst,
; wenn ein konkreter Grund dazukommt (neue Hardware-Unterstützung, eine
; Bibliothek, die Core 3.0 verlangt, oder ein relevanter Sicherheitsfix)
; — dann in einem eigenen Branch, mit Hardware-Test von Ton und Touch.
